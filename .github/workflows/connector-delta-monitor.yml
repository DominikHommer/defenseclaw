name: Connector Delta Monitor

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

# Analysis is read-only. Only the opt-in publisher job can write alert issues.
permissions:
  contents: read
  actions: read

concurrency:
  group: connector-delta-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.ref == 'refs/heads/main' && (vars.CONNECTOR_DELTA_MONITOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        connector: [claudecode, codex]
    env:
      CONNECTOR: ${{ matrix.connector }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Run hermetic monitor tests
        run: |
          python3 -m unittest discover -s cli/tests -p test_connector_delta_monitor.py
          python3 -m unittest discover -s cli/tests -p test_connector_invariants.py
          python3 -m unittest discover -s cli/tests -p test_connector_codex_delta.py
          python3 -m unittest discover -s cli/tests -p test_connector_delta_notifications.py
          python3 -m unittest discover -s cli/tests -p test_connector_delta_inventory.py

      - name: Restore last checkpoint from this trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p monitor-state monitor-output
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/connector-delta-monitor.yml/runs?branch=main&status=completed&per_page=10" > monitor-output/prior-runs.json
          count=$(jq '[.workflow_runs[] | select(.conclusion != "skipped" and (.event == "schedule" or .event == "workflow_dispatch"))] | length' monitor-output/prior-runs.json)
          if [ "$count" = 0 ]; then
            echo "First run: seed artifact baselines and the provider's initial release window, if any."
            exit 0
          fi
          while read -r run_id; do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq ".artifacts[] | select(.name == \"connector-delta-state-${CONNECTOR}\" and .expired == false) | .id")
            if [ -n "$artifact_id" ]; then
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "connector-delta-state-${CONNECTOR}" --dir monitor-state
              test -s monitor-state/state.json
              receipt_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq ".artifacts[] | select(.name == \"connector-delta-notified-${CONNECTOR}\" and .expired == false) | .id")
              if [ -n "$receipt_id" ]; then
                gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "connector-delta-notified-${CONNECTOR}" --dir monitor-state
              fi
              exit 0
            fi
          done < <(jq -r '.workflow_runs[] | select(.conclusion != "skipped" and (.event == "schedule" or .event == "workflow_dispatch")) | .id' monitor-output/prior-runs.json)
          echo "::error::Prior runs exist but no checkpoint is recoverable. Restore a baseline before resuming; do not silently skip history."
          exit 1

      - name: Collect pinned upstream artifacts
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/connector_delta_monitor.py collect --connector "$CONNECTOR" \
            --include-pr-inventory --state monitor-state/state.json --output monitor-output/snapshot.json
          result=$?
          set -e
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          # analyze records partial-source gaps and preserves those checkpoints.
          test -s monitor-output/snapshot.json

      - name: Match changes and analyze impact
        env:
          DELTA_AI_ENABLED: ${{ vars.CONNECTOR_DELTA_AI_ENABLED }}
          CONNECTOR_DELTA_MODEL: ${{ vars.CONNECTOR_DELTA_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.CONNECTOR_DELTA_ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          mode=off
          if [ "$DELTA_AI_ENABLED" = true ]; then
            test -n "$ANTHROPIC_API_KEY" && test -n "$CONNECTOR_DELTA_MODEL" || {
              echo "::error::AI is enabled but its dedicated API secret or model variable is missing."
              exit 1
            }
            mode=anthropic
          fi
          python3 scripts/connector_delta_monitor.py analyze \
            --connector "$CONNECTOR" \
            --snapshot monitor-output/snapshot.json \
            --state monitor-state/state.json \
            --output monitor-output/report.json \
            --summary monitor-output/report.md \
            --ai "$mode" --max-ai-calls 10

      - name: Project only public-safe reports and source checkpoints
        if: ${{ always() }}
        run: |
          python3 -m scripts.connector_delta.notifications publish \
            --report monitor-output/report.json --state monitor-state/state.json \
            --receipt monitor-state/receipt.json --directory monitor-public

      - name: Publish sanitized run summary
        if: ${{ always() }}
        run: |
          if [ -f monitor-public/report.md ]; then
            head -c 900000 monitor-public/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist public-source checkpoint without private AI cache
        if: ${{ always() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: connector-delta-state-${{ matrix.connector }}
          path: monitor-public/state.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload sanitized reports and notification envelope only
        if: ${{ always() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: connector-delta-report-${{ matrix.connector }}
          path: |
            monitor-public/report.json
            monitor-public/report.md
            monitor-public/notification.json
          if-no-files-found: warn
          retention-days: 30

  notify:
    needs: monitor
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && vars.CONNECTOR_DELTA_NOTIFICATIONS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        connector: [claudecode, codex]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: connector-delta-report-${{ matrix.connector }}
          path: monitor-public
      - name: Notify contributors through GitHub issue subscriptions and mentions
        env:
          CONNECTOR_DELTA_NOTIFICATIONS_ENABLED: ${{ vars.CONNECTOR_DELTA_NOTIFICATIONS_ENABLED }}
          CONNECTOR_DELTA_ALERT_REPOSITORY: ${{ vars.CONNECTOR_DELTA_ALERT_REPOSITORY }}
          CONNECTOR_DELTA_ALERT_AUTHOR: ${{ vars.CONNECTOR_DELTA_ALERT_AUTHOR }}
          CONNECTOR_DELTA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.CONNECTOR_DELTA_ALERT_TOKEN || github.token }}
        run: |
          python3 -m scripts.connector_delta.notifications notify \
            --envelope monitor-public/notification.json --receipt monitor-public/receipt.json
      - name: Persist successful notification receipt
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: connector-delta-notified-${{ matrix.connector }}
          path: monitor-public/receipt.json
          retention-days: 90
          if-no-files-found: error
