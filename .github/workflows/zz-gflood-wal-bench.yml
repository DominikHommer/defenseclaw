# Temporary G-flood-wal benchmark (bench/r104-g-flood-wal branch only; never merged).
# Old = fix/r104-g-flood 5bbc0ff3ec (1.0.3 audit store); new = this branch's parent.
name: zz G-flood-wal bench

on:
  push:
    branches: [bench/r104-g-flood-wal]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, v: r1-rate10a, ref: "", rate: "10", calls: "6000", trace: "1" }
          - { os: windows-latest, v: r1-rate10b, ref: "", rate: "10", calls: "6000", trace: "" }
          - { os: windows-latest, v: r1-rate5, ref: "", rate: "5", calls: "3000", trace: "" }
          - { os: ubuntu-latest, v: r1-rate10, ref: "", rate: "10", calls: "6000", trace: "" }
          - { os: macos-latest, v: r1-rate10, ref: "", rate: "10", calls: "6000", trace: "" }
    name: probe ${{ matrix.os }} ${{ matrix.v }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: probe
        shell: bash
        env:
          DEFENSECLAW_HOOK_FLOOD_PROBE: "1"
          DEFENSECLAW_HOOK_FLOOD_CALLS: ${{ matrix.calls }}
          DEFENSECLAW_HOOK_FLOOD_RATE: ${{ matrix.rate }}
          GFW_TRACE: ${{ matrix.trace }}
        run: |
          git log --oneline -1
          if [ -z "${{ matrix.ref }}" ]; then cp .github/zz-gfw/knobs.go internal/audit/zz_gfw_bench_knobs.go; fi
          go test -count=1 -timeout 45m -run '^TestHookFloodProbe$' -v ./internal/gateway/ > probe.log 2>&1 || true
          grep -E "minute|WAL|PASS|FAIL|sent|drained|flat|all |ok " probe.log || true
          grep -E -B3 -A12 "^--- FAIL|Error|panic" probe.log | head -60 || true
          echo "bounded writer phases: $(grep -c 'writer phase bounded=true' probe.log)"
          grep -E "writer phase bounded=true" probe.log | head -40 || true
          grep -E "audit persistence failed" probe.log | head -10 || true
