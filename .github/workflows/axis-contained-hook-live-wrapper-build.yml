name: AXIS contained hook outer custody build only

on:
  push:
    branches: [codex/axis-sandbox-feasibility]
    paths: [.github/workflows/axis-contained-hook-live-wrapper-build.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axis-contained-hook-outer-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Compile only the exact fixed custodian
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -E -s test/e2e/axis/native-hook-canary/live/build_wrapper_only.py
      - name: Retain bounded compiler/source/image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axis-contained-hook-outer-build-only-${{ github.sha }}
          path: contained-hook-outer-build-artifact/
          if-no-files-found: error
          retention-days: 14
