# Temporary G-flood benchmark (bench/r104-g-flood branch only; never merged).
name: zz G-flood bench

on:
  push:
    branches: [bench/r104-g-flood]

permissions:
  contents: read

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: sync cost
        shell: bash
        env:
          GFLOOD_SYNC: "1"
        run: |
          go test -count=1 -run '^TestGFlood(SyncCost|FlushViewCost)$' -v ./internal/audit/ 2>&1 | grep -E "sync|flush|Flush|ok|FAIL|PASS|panic|Error"
