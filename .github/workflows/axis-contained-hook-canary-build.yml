name: AXIS synthetic contained hook build only

on:
  push:
    branches: [codex/axis-sandbox-feasibility]
    paths: [.github/workflows/axis-contained-hook-canary-build.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axis-contained-hook-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Check fixed build recipe and run pure Python negative tests
        shell: bash
        env:
          EXPECTED_HELPER_SHA: 77d8f05f71bd3a158f1ad25c162a5c78aa9869b5c0eb27b100baf1be7f0577fa
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 -B -E -s - <<'PY'
          import hashlib, os
          from pathlib import Path
          p = Path('test/e2e/axis/native-hook-canary/build_only.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['EXPECTED_HELPER_SHA']
          PY
          python3 -B -E -s -m unittest discover -s test/e2e/axis/native-hook-canary -p test_build_only.py
      - name: Build payload, generate its literal pin, run host oracle, compile driver only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -E -s test/e2e/axis/native-hook-canary/build_only.py
      - name: Retain bounded source, generated pin, images and host-test/compiler metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axis-contained-hook-build-only-${{ github.sha }}
          path: contained-hook-build-artifact/
          if-no-files-found: error
          retention-days: 14
