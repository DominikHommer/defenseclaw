name: Connector Delta Checks
on:
  pull_request:
    paths:
      - 'scripts/connector_delta/**'
      - 'scripts/connector_delta_monitor.py'
      - 'cli/tests/connector_delta/**'
      - '.github/workflows/connector-delta-*.yml'
      - 'internal/gateway/connector/**'
      - 'internal/enterprisepolicy/**'
      - 'cli/defenseclaw/inventory/hook_contracts.json'
  push:
    branches: ['codex/claude-delta-monitor']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connector-delta-checks-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Offline comparison and notification tests
        run: python -m unittest discover -s cli/tests/connector_delta -v
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        connector: [codex, claudecode]
    env:
      CONNECTOR: ${{ matrix.connector }}
      CONNECTOR_DELTA_NOTIFICATIONS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Read current DefenseClaw main as the comparison target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: monitor-main
          persist-credentials: false
      - name: Collect current upstream and analyze with AI and notifications off
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result=0
          python scripts/connector_delta_monitor.py collect --connector "$CONNECTOR" \
            --include-pr-inventory --output monitor-smoke/snapshot.json || result=$?
          python scripts/connector_delta_monitor.py analyze --connector "$CONNECTOR" --repo monitor-main \
            --snapshot monitor-smoke/snapshot.json --state monitor-smoke/state.json \
            --output monitor-smoke/report.json --summary monitor-smoke/report.md --ai off || result=$?
          python -m scripts.connector_delta.notifications publish \
            --report monitor-smoke/report.json --state monitor-smoke/state.json --directory monitor-public
          exit "$result"
      - name: Upload public-safe smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: connector-delta-smoke-${{ matrix.connector }}
          path: |
            monitor-public/report.json
            monitor-public/report.md
          if-no-files-found: warn
          retention-days: 7
