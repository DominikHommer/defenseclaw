name: AXIS MXC V1 native macOS experiment

on:
  push:
    branches: [codex/axis-sandbox-feasibility, codex/axis-platform-live]
    paths:
      - .github/workflows/axis-mxc-v1-macos-live.yml
      - test/e2e/axis/mxc-macos/run_live.py
      - test/e2e/axis/mxc-macos/verify_live_artifact.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: axis-mxc-v1-macos-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-live:
    name: Run the reviewed fixed MXC Seatbelt experiment
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - name: Check out the live harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          path: live-source
          persist-credentials: false
          sparse-checkout: test/e2e/axis/mxc-macos

      - name: Check out the independently reviewed build source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: d05ed40afa43a1c1812259554646b887ae9a9c58
          path: build-source
          persist-credentials: false
          sparse-checkout: test/e2e/axis/mxc-macos

      - name: Fetch only the reviewed locked artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 evidence
          gh api repos/cisco-ai-defense/defenseclaw/actions/artifacts/12131291639 >evidence/artifact-api.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          item = json.loads(Path('evidence/artifact-api.json').read_text())
          assert item['id'] == 12131291639 and item['expired'] is False
          assert item['name'] == 'axis-mxc-v1-macos-contributor-d05ed40afa43a1c1812259554646b887ae9a9c58'
          assert item['digest'] == 'sha256:cf66cbfc1d72a98a7c3243a27200ca37125a406f4e5361eea7abe0e31190e0a3'
          assert item['workflow_run']['id'] == 39112683483
          assert item['workflow_run']['head_sha'] == 'd05ed40afa43a1c1812259554646b887ae9a9c58'
          PY
          gh run download 39112683483 --repo cisco-ai-defense/defenseclaw \
            --name axis-mxc-v1-macos-contributor-d05ed40afa43a1c1812259554646b887ae9a9c58 --dir locked-artifact

      - name: Verify every file before making the probe executable
        shell: bash
        run: |
          set -euo pipefail
          python3 live-source/test/e2e/axis/mxc-macos/verify_live_artifact.py \
            --artifact locked-artifact/build-artifact --source-checkout build-source \
            --provenance-sha256 e32554154d4bd5f869e977f7b446180c896361af85b9bec99bfa8de8657ba9e7 \
            --build-commit d05ed40afa43a1c1812259554646b887ae9a9c58 --build-run 39112683483 \
            --receipt evidence/artifact-verified.json
          python3 -m unittest discover -s live-source/test/e2e/axis/mxc-macos -p 'test_*.py'

      - name: Provision and record the explicit contributor watchdog
        timeout-minutes: 6
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        shell: bash
        run: |
          set -euo pipefail
          # This disposable test runner may provision its outer watchdog.
          # No product installer, runtime fallback or host security change.
          if ! brew list --versions coreutils >/dev/null 2>&1; then brew install coreutils; fi
          watchdog="$(brew --prefix coreutils)/bin/gtimeout"
          test -x "$watchdog"
          "$watchdog" --version >evidence/watchdog-version.txt
          sw_vers >evidence/macos-version.txt
          uname -a >evidence/kernel.txt
          printf 'MXC_TEST_GTIMEOUT=%s\n' "$watchdog" >>"$GITHUB_ENV"

      - name: Run only the fixed strict private offline experiment
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 live-source/test/e2e/axis/mxc-macos/run_live.py \
            --artifact locked-artifact/build-artifact --receipt evidence/artifact-verified.json --evidence evidence \
            --gtimeout "$MXC_TEST_GTIMEOUT" \
            --provenance-sha256 e32554154d4bd5f869e977f7b446180c896361af85b9bec99bfa8de8657ba9e7 \
            --build-commit d05ed40afa43a1c1812259554646b887ae9a9c58 --build-run 39112683483

      - name: Retain bounded results including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axis-mxc-v1-macos-live-${{ github.sha }}
          path: |
            evidence/*.json
            evidence/*.txt
          if-no-files-found: warn
          retention-days: 7
